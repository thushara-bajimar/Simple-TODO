<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="todo.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <section class="todo-card card shadow-sm mx-auto">
            <div class="card-body p-4">
                <h1 class="h3 card-title mb-4">TODO App</h1>
                <div class="input-group mb-4">
                    <input class="form-control" type="text" placeholder="Enter a task" aria-label="Enter a task">
                    <button class="btn btn-primary" type="button">Add Task</button>
                </div>
                <ul class="list-group">
                    <li class="list-group-item d-flex align-items-center">eat <button class="del btn btn-outline-danger btn-sm ms-auto">Delete</button></li>
                    <li class="list-group-item d-flex align-items-center">sleep <button class="del btn btn-outline-danger btn-sm ms-auto">Delete</button></li>
                </ul>
            </div>
        </section>
    </main>

    <script src="todo.js"></script>
</body>
</html>
